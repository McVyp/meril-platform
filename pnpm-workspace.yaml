packages:
  - "apps/*"
  - "services/*"
  - "packages/*"

allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  protobufjs: true

onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - "@prisma/engines"
  - esbuild
  - prisma
  - protobufjs
verifyDepsBeforeRun: false

overrides:
  "body-parser@<2.4.0": "^2.4.0"
  "@grpc/grpc-js@<1.14.5": "^1.14.5"
  "protobufjs@<7.6.5": "^7.6.5"
  "uuid@<11.1.1": "^11.1.1"