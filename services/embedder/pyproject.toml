[project]
name = "embedder"
version = "0.1.0"
description = "Embeds search queries"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "numpy>=2.5.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint.isort]
known-first-party = ["main"]