name: Audit

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm audit --prod

  python:
    name: pip-audit (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [embedder, media-processor]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv export --frozen --no-dev --no-hashes --no-emit-project -o requirement-audit.txt
      - run: uvx pip-audit --requirement requirement-audit.txt --disable-pip --no-deps
    
  go:
    name: govulncheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/recommender
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/recommender/go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
