name: CI

on:
  push:
    branches: [meril, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (type-check)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci # dummy value, not used in this job
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @meril/db generate
      - run: pnpm --filter @meril/db build
      - run: pnpm --filter @meril/api-gateway type-check
      - run: pnpm --filter @meril/event-consumer type-check
      - run: pnpm --filter web exec next typegen
      - run: pnpm --filter web exec tsc --noEmit

  go:
    name: Go (recommender)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/recommender
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/recommender/go.mod
          cache-dependency-path: services/recommender/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go build ./...

  proto:
    name: Proto (buf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: buf lint
      - run: buf format -d --exit-code

  python:
    name: Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uvx ruff format --check services/media-processor services/embedder
      - run: uvx ruff check services/media-processor services/embedder

  migrations:
    name: Migrations (index guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: No migration drops custom indexes
        run: |
          if grep -rnE 'DROP INDEX "Video_(embedding_hnsw|title_trgm|description_trgm)_idx"' packages/db/prisma/migrations; then
            echo "Error: a migration drops a custom index (HNSW or trigram)"
            exit 1
          fi
