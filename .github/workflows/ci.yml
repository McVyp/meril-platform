name: CI

on:
  push:
    branches: [meril, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (type-check)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci_test
      TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/ci_test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @meril/db generate
      - run: pnpm --filter @meril/db build
      - run: pnpm --filter @meril/db exec prisma migrate deploy
      - run: pnpm --filter @meril/api-gateway type-check
      - run: pnpm --filter @meril/api-gateway test
      - name: Gateway dependecies load at runtime
        working-directory: services/api-gateway
        run: node -e "for (const d of Object.keys(require('./package.json').dependencies)) require(d)"
      - run: pnpm --filter @meril/event-consumer type-check
      - run: pnpm --filter web exec next typegen
      - run: pnpm --filter web exec tsc --noEmit

  go:
    name: Go (recommender)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci_test
      TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/ci_test
    defaults:
      run:
        working-directory: services/recommender
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/recommender/go.mod
          cache-dependency-path: services/recommender/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go build ./...
      - name: Apply migrations
        working-directory: .
        run: |
          for f in packages/db/prisma/migrations/*/migration.sql; do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - run: go test ./...

  proto:
    name: Proto (buf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: buf lint
      - run: buf format -d --exit-code

  python:
    name: Python (ruff, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uvx ruff format --check services/media-processor services/embedder
      - run: uvx ruff check services/media-processor services/embedder
      - name: Embedder tests
        working-directory: services/embedder
        run: uv run pytest -q

  migrations:
    name: Migrations (index guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: No migration drops custom indexes
        run: |
          if grep -rnE 'DROP INDEX "Video_(embedding_hnsw|title_trgm|description_trgm)_idx"' packages/db/prisma/migrations; then
            echo "Error: a migration drops a custom index (HNSW or trigram)"
            exit 1
          fi
