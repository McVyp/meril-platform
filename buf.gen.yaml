version: v2
inputs:
  - directory: proto
plugins:
  - local: protoc-gen-go
    out: services/recommender/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: services/recommender/gen
    opt: paths=source_relative
  - local: services/api-gateway/node_modules/.bin/protoc-gen-es
    out: services/api-gateway/src/gen
    opt: target=ts
